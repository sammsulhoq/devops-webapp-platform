services:
  web:
    build:
      context: .
    image: devops-webapp-platform:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_VERSION: "${APP_VERSION:-compose-local}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
