grafana:
  service:
    type: ClusterIP
  persistence:
    enabled: false
  admin:
    existingSecret: monitoring-grafana-admin

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 6h
    serviceMonitorSelectorNilUsesHelmValues: false

alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    configSecret: capstone-alertmanager-config
    storage: {}
