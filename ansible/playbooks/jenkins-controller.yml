---
- name: Install Jenkins controller
  hosts: jenkins_controller
  become: true

  tasks:
    - name: Install Java runtime
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre-headless
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Create package signing key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Jenkins repository signing key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Jenkins LTS repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present
        update_cache: true

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        lock_timeout: 300

    - name: Enable and start Jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        enabled: true
        state: started

    - name: Wait for Jenkins to listen on port 8080
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 180
